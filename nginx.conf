server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Alles kommt vom eigenen Server: keine externen Schriften, Skripte oder Tracker.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Schriften und Bilder ändern sich selten.
    location ~* ^/(fonts|bilder)/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
